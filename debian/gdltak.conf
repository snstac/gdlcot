# GDLTAK: CoT to GDL90 gateway — /etc/default/gdltak (systemd EnvironmentFile).
# Broadcasts the local TAK air picture as GDL90 so EFB apps (ForeFlight, FlyQ,
# Garmin Pilot) on the same network display the traffic that TAK sees.

# Where to read CoT from (PyTAK-style URL). Default is the AryaOS / ATAK
# Mesh SA multicast group:
COT_URL=udp+ro://239.2.3.1:6969

# Where to send GDL90 datagrams. Default is the stratux/ForeFlight
# convention (UDP broadcast on port 4000); unicast also works:
GDL90_URL=udp+broadcast://255.255.255.255:4000
# GDL90_URL=udp://192.168.1.50:4000

# Drop tracks not updated within this many seconds:
STALE_SECS=60

# Update rate in Hz (GDL90 heartbeat convention is 1):
UPDATE_HZ=1

# Ownship: either the CoT UID whose track becomes the Ownship Report
# (e.g. this device's gpstak/lincot UID) ...
# OWNSHIP_UID=GPSTAK-mysensor
# ... or a static position fallback. If neither is set, GDLTAK sends
# heartbeat + traffic only (most EFBs are fine with that):
# OWNSHIP_LAT=37.76
# OWNSHIP_LON=-122.4
# OWNSHIP_ALT_FT=100

# Ownship callsign shown in the EFB:
CALLSIGN=GDLTAK
